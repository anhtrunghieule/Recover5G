    init: true
    cap_add: [NET_ADMIN]
    command: ["open5gs-udmd","-c","/cfg/udm.yaml"]
    depends_on: [mongo, nrf]
  udr:
    image: ${OPEN5GS_IMAGE:-r5g/open5gs:e85748e}
