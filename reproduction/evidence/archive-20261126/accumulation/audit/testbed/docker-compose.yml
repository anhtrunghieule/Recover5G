# Generated by gen_compose (see README). Open5GS image selected via $OPEN5GS_IMAGE.
name: r5g
networks:
  core:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/24
services:
  mongo:
    image: mongo:7.0
    container_name: r5g-mongo
    networks: {core: {ipv4_address: 172.22.0.100}}
    command: ["--bind_ip_all", "--quiet"]
  nrf:
    image: ${OPEN5GS_IMAGE:-r5g/open5gs:e85748e}
    container_name: r5g-nrf
    networks: {core: {ipv4_address: 172.22.0.10}}
    volumes: ["./config/open5gs/nrf.yaml:/cfg/nrf.yaml:ro"]
    init: true
    cap_add: [NET_ADMIN]
    command: ["open5gs-nrfd","-c","/cfg/nrf.yaml"]
  scp:
    image: ${OPEN5GS_IMAGE:-r5g/open5gs:e85748e}
    container_name: r5g-scp
    networks: {core: {ipv4_address: 172.22.0.200}}
    volumes: ["./config/open5gs/scp.yaml:/cfg/scp.yaml:ro"]
    init: true
    cap_add: [NET_ADMIN]
    command: ["open5gs-scpd","-c","/cfg/scp.yaml"]
    depends_on: [nrf]
  ausf:
    image: ${OPEN5GS_IMAGE:-r5g/open5gs:e85748e}
    container_name: r5g-ausf
    networks: {core: {ipv4_address: 172.22.0.11}}
    volumes: ["./config/open5gs/ausf.yaml:/cfg/ausf.yaml:ro"]
    init: true
    cap_add: [NET_ADMIN]
    command: ["open5gs-ausfd","-c","/cfg/ausf.yaml"]
    depends_on: [mongo, nrf]
  udm:
    image: ${OPEN5GS_IMAGE:-r5g/open5gs:e85748e}
