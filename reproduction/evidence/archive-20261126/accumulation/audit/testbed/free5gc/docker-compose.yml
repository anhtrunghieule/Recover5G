name: f5g
services:
  free5gc-upf:
    container_name: f5g-upf
    image: free5gc/upf:v4.0.1
    command: bash -c "./upf-iptables.sh && ./upf -c ./config/upfcfg.yaml"
    volumes:
      - ./compose/config/upfcfg.yaml:/free5gc/config/upfcfg.yaml
      - ./compose/config/upf-iptables.sh:/free5gc/upf-iptables.sh
    cap_add:
      - NET_ADMIN
    networks:
      privnet:
        aliases:
          - upf.free5gc.org

  db:
    container_name: f5g-mongodb
    image: mongo:7.0
    command: mongod --port 27017
    expose:
      - "27017"
    volumes:
      - dbdata:/data/db
    networks:
      privnet:
        aliases:
          - db

  free5gc-nrf:
    container_name: f5g-nrf
    image: free5gc/nrf:v4.0.1
    command: ./nrf -c ./config/nrfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./compose/config/nrfcfg.yaml:/free5gc/config/nrfcfg.yaml
      - ./compose/cert:/free5gc/cert
    environment:
      DB_URI: mongodb://db/free5gc
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - nrf.free5gc.org
    depends_on:
      - db

  free5gc-amf:
    container_name: f5g-amf
    image: free5gc/amf:v4.0.1
    command: ./amf -c ./config/amfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./compose/config/amfcfg.yaml:/free5gc/config/amfcfg.yaml
      - ./compose/cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      privnet:
        ipv4_address: 10.100.200.16
        aliases:
          - amf.free5gc.org
    depends_on:
      - free5gc-nrf

  free5gc-ausf:
    container_name: f5g-ausf
    image: free5gc/ausf:v4.0.1
    command: ./ausf -c ./config/ausfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./compose/config/ausfcfg.yaml:/free5gc/config/ausfcfg.yaml
      - ./compose/cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - ausf.free5gc.org
    depends_on:
      - free5gc-nrf

  free5gc-nssf:
    container_name: f5g-nssf
    image: free5gc/nssf:v4.0.1
    command: ./nssf -c ./config/nssfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./compose/config/nssfcfg.yaml:/free5gc/config/nssfcfg.yaml
      - ./compose/cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - nssf.free5gc.org
    depends_on:
      - free5gc-nrf

  free5gc-pcf:
    container_name: f5g-pcf
    image: free5gc/pcf:v4.0.1
    command: ./pcf -c ./config/pcfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./compose/config/pcfcfg.yaml:/free5gc/config/pcfcfg.yaml
      - ./compose/cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - pcf.free5gc.org
    depends_on:
      - free5gc-nrf

  free5gc-smf:
    container_name: f5g-smf
    image: free5gc/smf:v4.0.1
    command: ./smf -c ./config/smfcfg.yaml -u ./config/uerouting.yaml
    expose:
      - "8000"
    volumes:
      - ./compose/config/smfcfg.yaml:/free5gc/config/smfcfg.yaml
      - ./compose/config/uerouting.yaml:/free5gc/config/uerouting.yaml
      - ./compose/cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - smf.free5gc.org
    depends_on:
      - free5gc-nrf
      - free5gc-upf

  free5gc-udm:
    container_name: f5g-udm
    image: free5gc/udm:v4.0.1
    command: ./udm -c ./config/udmcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./compose/config/udmcfg.yaml:/free5gc/config/udmcfg.yaml
      - ./compose/cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - udm.free5gc.org
    depends_on:
      - db
      - free5gc-nrf

  free5gc-udr:
    container_name: f5g-udr
    image: free5gc/udr:v4.0.1
    command: ./udr -c ./config/udrcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./compose/config/udrcfg.yaml:/free5gc/config/udrcfg.yaml
      - ./compose/cert:/free5gc/cert
    environment:
      DB_URI: mongodb://db/free5gc
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - udr.free5gc.org
    depends_on:
      - db
      - free5gc-nrf

  free5gc-chf:
    container_name: f5g-chf
    image: free5gc/chf:v4.0.1
    command: ./chf -c ./config/chfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./compose/config/chfcfg.yaml:/free5gc/config/chfcfg.yaml
      - ./compose/cert:/free5gc/cert
    environment:
      DB_URI: mongodb://db/free5gc
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - chf.free5gc.org
    depends_on:
      - db
      - free5gc-nrf
      - free5gc-webui

  free5gc-webui:
    container_name: f5g-webui
    image: free5gc/webui:v4.0.1
    command: ./webui -c ./config/webuicfg.yaml
    expose:
      - "2121"
    volumes:
      - ./compose/config/webuicfg.yaml:/free5gc/config/webuicfg.yaml
    environment:
      - GIN_MODE=release
    networks:
      privnet:
        aliases:
          - webui
    depends_on:
      - db
      - free5gc-nrf

  ueransim:
    container_name: f5g-ueransim
    image: r5g/ueransim:4f45e18-p1
    command: nr-gnb -c /cfg/gnbcfg.yaml
    volumes:
      - ./compose/config/gnbcfg.yaml:/cfg/gnbcfg.yaml
      - ./compose/config/uecfg.yaml:/cfg/uecfg.yaml
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun"
    networks:
      privnet:
        aliases:
          - gnb.free5gc.org
    depends_on:
      - free5gc-amf
      - free5gc-upf

  probe:
    container_name: f5g-probe
    image: r5g/open5gs:e85748e
    command: ["sleep","infinity"]
    networks: [privnet]

networks:
  privnet:
    ipam:
      driver: default
      config:
        - subnet: 10.100.200.0/24
    driver_opts:
      com.docker.network.bridge.name: br-f5g

volumes:
  dbdata:
