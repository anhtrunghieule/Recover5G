      - address: 172.22.0.4
        port: 7777
    client:
      scp:
        - uri: http://172.22.0.200:7777
  pfcp:
    server:
      - address: 172.22.0.4
    client:
      upf:
        - address: 172.22.0.7
  gtpc:
    server:
      - address: 172.22.0.4
  gtpu:
    server:
      - address: 172.22.0.4
  metrics:
    server:
      - address: 172.22.0.4
        port: 9090
  session:
    - subnet: 10.45.0.0/16
      gateway: 10.45.0.1
  dns:
    - 8.8.8.8
    - 8.8.4.4
  mtu: 1400

